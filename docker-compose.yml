name: caretaker

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-caretaker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-caretaker}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-caretaker}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-caretaker}
    depends_on:
      db:
        condition: service_healthy
    # Not published: the frontend's nginx proxies /api (and the WebSocket) to it.
    profiles: ["app"]

  frontend:
    build:
      # repo root: the build reads ../DESIGN.md for design tokens
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_ENABLE_SIMULATOR: ${VITE_ENABLE_SIMULATOR:-false}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    profiles: ["app"]

volumes:
  pgdata:
