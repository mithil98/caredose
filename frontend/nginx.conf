map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # nginx drops inherited add_header in any location that sets its own, so include everywhere.
  include /etc/nginx/snippets/security-headers.conf;

  # API + WebSocket to the backend (same origin: refresh cookie and no CORS needed)
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # The service worker and manifest must always be revalidated so updates roll out.
  location ~* ^/(service-worker\.js|manifest\.webmanifest|index\.html)$ {
    add_header Cache-Control "no-cache";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri /index.html;
  }
}
