[project]
name = "caretaker-backend"
version = "1.0.0"
requires-python = ">=3.12"
# Keep in sync with requirements.txt (Docker/pip use that; Vercel may read either).
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]>=0.35",
    "sqlalchemy==2.1.3",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "pydantic-settings>=2.10",
    "email-validator>=2.2",
    "pyjwt>=2.10",
    "argon2-cffi>=25.1",
    "pywebpush==2.5.0",
    "tzdata>=2025.2",
    "httpx>=0.28",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

# Only the application package ships; alembic/, scripts/ and tests/ are not importable packages.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
